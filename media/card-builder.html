<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Builder - Dev Timekeeper</title>
  <link rel="stylesheet" href="{{CSS_URI}}">
</head>

<body>
  <div class="builder">

    <!-- ── Controls Sidebar ─────────────────────────────────────── -->
    <div class="controls">

      <div class="controls-header">
        <span class="controls-icon">⏱</span>
        <span class="controls-title">Card Builder</span>
      </div>

      <!-- Layout Picker -->
      <div class="section">
        <div class="section-label">LAYOUT</div>
        <div class="layout-picker">
          <button class="layout-btn active" data-layout="A" title="Dark Glass">
            <div class="layout-thumb a-thumb"></div>
            <span>Dark Glass</span>
          </button>
          <button class="layout-btn" data-layout="B" title="Minimal Light">
            <div class="layout-thumb b-thumb"></div>
            <span>Light</span>
          </button>
          <button class="layout-btn" data-layout="C" title="Vibrant Gradient">
            <div class="layout-thumb c-thumb"></div>
            <span>Gradient</span>
          </button>
        </div>
      </div>

      <!-- Time Range -->
      <div class="section">
        <div class="section-label">TIME RANGE</div>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="range" value="lifetime" checked>
            <span>Lifetime</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="range" value="l30">
            <span>Last 30 Days</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="range" value="l7">
            <span>Last 7 Days</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="range" value="month">
            <span>This Month</span>
          </label>
        </div>
      </div>

      <!-- Stat Pills -->
      <div class="section">
        <div class="section-label">STAT PILLS <span class="section-hint">(4 slots)</span></div>
        <div class="slots" id="slotsContainer"></div>
      </div>

      <!-- Fun Fact -->
      <div class="section">
        <div class="section-label">FUN FACT</div>
        <select class="select" id="funFactSelect">
          <option value="coffee">☕ Coffees powered this</option>
          <option value="netflix">📺 Netflix episodes worth</option>
          <option value="days">🚀 Days of non-stop coding</option>
          <option value="books">📚 Books you could've read</option>
          <option value="sleep">😴 Nights of sleep skipped</option>
          <option value="none">— No fun fact</option>
        </select>
      </div>

      <!-- Chart -->
      <div class="section">
        <div class="section-label">CHART</div>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="chart" value="bar" checked>
            <span>Bar Chart</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="chart" value="line">
            <span>Line Chart</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="chart" value="none">
            <span>None</span>
          </label>
        </div>
      </div>

      <!-- Bottom Section -->
      <div class="section">
        <div class="section-label">BOTTOM SECTION</div>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="bottom" value="projects" checked>
            <span>Top Projects</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="bottom" value="none">
            <span>None</span>
          </label>
        </div>
      </div>

      <!-- Projects Selection -->
      <div class="section">
        <div class="section-label">PROJECTS</div>
        <div class="project-search-wrap">
          <input type="text" id="projectSearch" class="project-search-input" placeholder="Search projects...">
        </div>
        <div class="project-action-links">
          <button id="selectAllBtn" class="project-action-btn">Select All</button>
          <button id="selectNoneBtn" class="project-action-btn">Select None</button>
        </div>
        <div class="projects-list" id="projectsList">
          <!-- checkboxes generated by JS -->
        </div>
      </div>

      <!-- Download -->
      <div class="section download-section">
        <button id="downloadBtn" class="download-btn">↓ &nbsp;Download PNG</button>
        <div id="statusText" class="status-text"></div>
      </div>

    </div>

    <!-- ── Preview Panel ─────────────────────────────────────────── -->
    <div class="preview-panel">
      <canvas id="previewCanvas"></canvas>
    </div>

  </div>

  <div id="app-data" data-json='{{DATA}}' style="display:none;"></div>
  <script src="{{JS_URI}}"></script>
</body>

</html>
