<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0e0e18"/>
    </linearGradient>

    <!-- Arc / ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="128" height="128" rx="26" ry="26" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines (background texture) -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="32" y1="0" x2="32" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="96" y1="0" x2="96" y2="128"/>
  </g>

  <!-- Outer glow ring (decorative) -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.25"/>

  <!-- Main clock ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="5" filter="url(#shadow)"/>

  <!-- Inner clock face (dark fill) -->
  <circle cx="64" cy="64" r="38" fill="#12121f"/>

  <!-- Clock tick marks -->
  <g stroke="#334155" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="29" x2="64" y2="35"/>
    <line x1="99" y1="64" x2="93" y2="64"/>
    <line x1="64" y1="99" x2="64" y2="93"/>
    <line x1="29" y1="64" x2="35" y2="64"/>
  </g>

  <!-- Minor ticks -->
  <g stroke="#1e293b" stroke-width="1" stroke-linecap="round">
    <line x1="81.6" y1="30.5" x2="79.7" y2="36"/>
    <line x1="95.5" y1="46.4" x2="90" y2="48.3"/>
    <line x1="97.5" y1="81.6" x2="92" y2="79.7"/>
    <line x1="81.6" y1="97.5" x2="79.7" y2="92"/>
    <line x1="46.4" y1="97.5" x2="48.3" y2="92"/>
    <line x1="30.5" y1="81.6" x2="36" y2="79.7"/>
    <line x1="30.5" y1="46.4" x2="36" y2="48.3"/>
    <line x1="46.4" y1="30.5" x2="48.3" y2="36"/>
  </g>

  <!-- Hour hand (~10 o'clock) -->
  <line x1="64" y1="64" x2="47" y2="45"
        stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Minute hand (~12:00) -->
  <line x1="64" y1="64" x2="64" y2="34"
        stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Second hand (~2 o'clock) -->
  <line x1="64" y1="64" x2="76" y2="37"
        stroke="#f472b6" stroke-width="1.2" stroke-linecap="round"
        opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="4" fill="url(#ringGrad)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff"/>

  <!-- Code bracket ">" on lower-right (dev hint) -->
  <g filter="url(#glow)" opacity="0.9">
    <polyline points="86,76 92,82 86,88"
              fill="none" stroke="#00d4ff" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="95" y1="88" x2="88" y2="88"
          stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
