<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #181825; rx: 16px; }
      .container { fill: #11111b; stroke: #45475a; stroke-width: 1.5; rx: 12px; }
      .card { fill: #1e1e2e; stroke: #313244; stroke-width: 1.5; rx: 8px; }
      .card-highlight { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 8px; }
      .header-title { fill: #89b4fa; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; }
      .section-badge { fill: #89b4fa; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .card-title { fill: #cdd6f4; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .card-desc { fill: #a6adc8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .tag-text { fill: #bac2de; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .accent-green { fill: #a6e3a1; }
      .accent-blue { fill: #89b4fa; }
      .accent-purple { fill: #cba6f7; }
      .accent-peach { fill: #fab387; }
      .accent-yellow { fill: #f9e2af; }
      .accent-teal { fill: #89dceb; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Diagram Title -->
  <text x="440" y="38" text-anchor="middle" class="header-title">📊 8 Dashboard Visual Analytics Architecture</text>

  <!-- Outer Webview Frame -->
  <rect x="30" y="60" width="820" height="490" class="container" />
  <rect x="45" y="72" width="12" height="12" rx="6" fill="#f38ba8" />
  <rect x="63" y="72" width="12" height="12" rx="6" fill="#f9e2af" />
  <rect x="81" y="72" width="12" height="12" rx="6" fill="#a6e3a1" />
  <text x="440" y="83" text-anchor="middle" fill="#6c7086" font-family="system-ui" font-size="12px" font-weight="600">⏱️ Dev Timekeeper Live Webview Dashboard</text>

  <!-- Section 1: Executive KPI Summary Cards -->
  <rect x="50" y="100" width="780" height="65" class="card-highlight" />
  <text x="65" y="125" class="card-title"><tspan class="accent-blue">1️⃣ Executive KPI Summary Cards</tspan></text>
  <text x="65" y="148" class="card-desc">Today • Yesterday • Week • Month • Lifetime • Daily Avg • Active Days • Top Project</text>
  
  <!-- Row 1: Heatmap + 30-Day Trend -->
  <!-- Section 2: Hour-of-Day Productivity Heatmap -->
  <rect x="50" y="180" width="375" height="105" class="card" />
  <text x="65" y="205" class="card-title"><tspan class="accent-green">2️⃣ Productivity Heatmap</tspan></text>
  <text x="65" y="226" class="card-desc">Hour-of-Day Focus % (00:00 to 23:00)</text>
  <rect x="65" y="240" width="345" height="30" fill="#181825" rx="4" />
  <!-- Heatmap Mini Visual Bars -->
  <rect x="75" y="250" width="10" height="12" fill="#313244" rx="2" />
  <rect x="90" y="250" width="10" height="12" fill="#313244" rx="2" />
  <rect x="105" y="246" width="10" height="16" fill="#45475a" rx="2" />
  <rect x="120" y="244" width="10" height="18" fill="#585b70" rx="2" />
  <rect x="135" y="244" width="10" height="18" fill="#89b4fa" rx="2" />
  <rect x="150" y="242" width="10" height="20" fill="#a6e3a1" rx="2" />
  <rect x="165" y="242" width="10" height="20" fill="#a6e3a1" rx="2" />
  <rect x="180" y="245" width="10" height="17" fill="#89b4fa" rx="2" />
  <rect x="195" y="248" width="10" height="14" fill="#585b70" rx="2" />

  <!-- Section 5: 30-Day Stacked Trend Chart -->
  <rect x="455" y="180" width="375" height="105" class="card" />
  <text x="470" y="205" class="card-title"><tspan class="accent-purple">5️⃣ 30-Day Trend Chart</tspan></text>
  <text x="470" y="226" class="card-desc">Stacked Area Chart (Top 6 Projects + Others)</text>
  <path d="M 470 268 Q 530 245 590 255 T 710 240 T 815 260 L 815 272 L 470 272 Z" fill="#cba6f7" opacity="0.3" />
  <path d="M 470 268 Q 530 245 590 255 T 710 240 T 815 260" fill="none" stroke="#cba6f7" stroke-width="2" />

  <!-- Row 2: Weekly Stacked + 6-Month History -->
  <!-- Section 4: Weekly Stacked Activity -->
  <rect x="50" y="300" width="375" height="105" class="card" />
  <text x="65" y="325" class="card-title"><tspan class="accent-yellow">4️⃣ Weekly Stacked Activity</tspan></text>
  <text x="65" y="346" class="card-desc">Day-by-Day breakdown for the last 7 days</text>
  <!-- Mini Stacked Bars -->
  <rect x="75" y="360" width="22" height="32" fill="#89b4fa" rx="2" />
  <rect x="110" y="365" width="22" height="27" fill="#a6e3a1" rx="2" />
  <rect x="145" y="355" width="22" height="37" fill="#f9e2af" rx="2" />
  <rect x="180" y="370" width="22" height="22" fill="#cba6f7" rx="2" />
  <rect x="215" y="350" width="22" height="42" fill="#89b4fa" rx="2" />
  <rect x="250" y="362" width="22" height="30" fill="#a6e3a1" rx="2" />

  <!-- Section 6: 6-Month History Comparison -->
  <rect x="455" y="300" width="375" height="105" class="card" />
  <text x="470" y="325" class="card-title"><tspan class="accent-peach">6️⃣ 6-Month History Comparison</tspan></text>
  <text x="470" y="346" class="card-desc">High-level quarterly bar chart analysis</text>
  <rect x="480" y="360" width="35" height="32" fill="#fab387" rx="3" />
  <rect x="530" y="365" width="35" height="27" fill="#fab387" rx="3" />
  <rect x="580" y="352" width="35" height="40" fill="#fab387" rx="3" />
  <rect x="630" y="358" width="35" height="34" fill="#fab387" rx="3" />

  <!-- Row 3: Language Map & Sortable Table -->
  <!-- Section 7 & 3: Language & Project Totals -->
  <rect x="50" y="420" width="375" height="110" class="card" />
  <text x="65" y="445" class="card-title"><tspan class="accent-teal">3️⃣ Project Distribution &amp; 7️⃣ Language Map</tspan></text>
  <text x="65" y="466" class="card-desc">Language bubble chart &amp; per-project breakdown</text>
  <circle cx="95" cy="495" r="16" fill="#89b4fa" opacity="0.8" />
  <text x="95" y="499" text-anchor="middle" fill="#11111b" font-family="system-ui" font-size="9px" font-weight="700">TS</text>
  <circle cx="132" cy="495" r="14" fill="#a6e3a1" opacity="0.8" />
  <text x="132" y="499" text-anchor="middle" fill="#11111b" font-family="system-ui" font-size="9px" font-weight="700">Py</text>
  <circle cx="165" cy="495" r="12" fill="#f9e2af" opacity="0.8" />
  <text x="165" y="499" text-anchor="middle" fill="#11111b" font-family="system-ui" font-size="8px" font-weight="700">JS</text>

  <!-- Section 8: Sortable File & Project Table -->
  <rect x="455" y="420" width="375" height="110" class="card" />
  <text x="470" y="445" class="card-title"><tspan class="accent-blue">8️⃣ Sortable File &amp; Project Data Explorer</tspan></text>
  <text x="470" y="466" class="card-desc">Detailed search, filter &amp; multi-column sorting</text>
  <rect x="470" y="480" width="345" height="18" fill="#181825" rx="3" />
  <rect x="470" y="503" width="345" height="18" fill="#181825" rx="3" />
</svg>
