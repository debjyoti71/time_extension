name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Detect Version & Check Existing Tag
        id: check_version
        shell: bash
        run: |
          # Read version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          
          echo "Package Version: ${VERSION}"
          echo "Target Tag: ${TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Check if git tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Skipping automatic release creation."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected! Will create GitHub release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Extension (.vsix)
        if: steps.check_version.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Generate Rich Release Notes
        if: steps.check_version.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: node scripts/extract-release-notes.mjs ${{ steps.check_version.outputs.version }} RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.check_version.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: Dev Timekeeper v${{ steps.check_version.outputs.version }}
          draft: false
          prerelease: false
          files: "*.vsix"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace (Optional)
        if: (steps.check_version.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
