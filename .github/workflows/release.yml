name: Publish Marketplace

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from git
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$ ]]; then
            VERSION="$(node scripts/sync-version-from-git.mjs)"
          else
            node scripts/sync-version-from-git.mjs "$VERSION" >/dev/null
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: npm run compile

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies
